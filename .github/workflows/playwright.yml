name: Session 4
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  run_test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 25
    - name: Install dependencies
      run: npm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Debug workspace
      run: ls -la && pwd
    - name: Run Playwright tests
      run: npx playwright test e2e/session-4/ex1.spec.ts e2e/session-4/ex2.spec.ts --shard=${{ matrix.shard }}/2 --reporter=blob-report
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: blob-report-session-04-shard-${{ matrix.shard }}
        path: blob-report
        retention-days: 30
    
  merge-reports:
    needs: run_test
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 25
    - name: Install dependencies
      run: npm install
    - name: Download blob reports from all shards
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: blob-report-session-04-shard-*
        merge-multiple: true
    - name: Merge reports
      run: npx playwright merge-reports --reporter html ./all-blob-reports
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-session-04
        path: session-04/playwright-report/
        retention-days: 30
